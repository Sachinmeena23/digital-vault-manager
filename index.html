<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Vault Manager - Personal & Business Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #06b6d4;
      --accent: #10b981;
      --danger: #ef4444;
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      color: #e2e8f0;
      transition: all 0.3s ease;
    }

    body.light-mode {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #1e293b;
    }

    /* Glassmorphism Cards */
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(51, 65, 85, 0.3);
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    body.light-mode .card {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(203, 213, 225, 0.5);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2);
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #8b5cf6, #06b6d4, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glowing Badges */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .badge-business {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    .badge-personal {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(168, 85, 247, 0.2));
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.3);
    }

    .badge-urgent {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2));
      color: #fca5a5;
      border: 1px solid rgba(252, 165, 165, 0.3);
    }

    .badge-video {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(52, 211, 153, 0.2));
      color: #6ee7b7;
      border: 1px solid rgba(110, 231, 183, 0.3);
    }

    .badge-web {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(34, 197, 234, 0.2));
      color: #67e8f9;
      border: 1px solid rgba(103, 232, 249, 0.3);
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(139, 92, 246, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: white;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Input Fields */
    .input-field {
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(51, 65, 85, 0.8);
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
    }

    body.light-mode .input-field {
      background: rgba(241, 245, 249, 0.8);
      border-color: rgba(139, 92, 246, 0.3);
      color: #1e293b;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    body.light-mode .modal-content {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border-color: rgba(139, 92, 246, 0.2);
    }

    /* Loading Spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      overflow-x: auto;
      padding-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      color: #94a3b8;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: #8b5cf6;
      border-bottom-color: #8b5cf6;
    }

    /* Search Bar */
    .search-container {
      position: relative;
      margin-bottom: 24px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 40px 12px 16px;
      background: rgba(51, 65, 85, 0.5);
      border: 2px solid rgba(139, 92, 246, 0.3);
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 15px;
    }

    .search-bar:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(51, 65, 85, 0.8);
    }

    body.light-mode .search-bar {
      background: rgba(241, 245, 249, 0.8);
      border-color: rgba(139, 92, 246, 0.3);
      color: #1e293b;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 8px 16px rgba(139, 92, 246, 0.4);
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(20deg);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .modal-content {
        padding: 20px;
        max-width: 95%;
      }

      .btn {
        padding: 8px 16px;
        font-size: 12px;
      }

      .tabs {
        gap: 4px;
      }

      .tab-btn {
        padding: 8px 16px;
        font-size: 13px;
      }
    }

    /* Video Thumbnail */
    .video-thumbnail {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.1));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .video-thumbnail:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
    }

    /* Favorite Star */
    .star-icon {
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .star-icon.active {
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
    }

    /* Copy Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      animation: slideUp 0.3s ease;
      z-index: 2000;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .empty-state i {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Skeleton Loader */
    .skeleton {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.1));
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Main Container -->
  <div class="min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-4xl md:text-5xl font-bold gradient-text mb-2">🔐 Digital Vault Manager</h1>
        <p class="text-gray-400">Personal & Business Hub - सभी डेटा एक जगह सुरक्षित रखें</p>
      </div>

      <!-- Stats Dashboard -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="card p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-400 text-sm mb-2">Business Docs</p>
              <p class="text-2xl font-bold" id="docCount">0</p>
            </div>
            <i class="fas fa-file-alt text-3xl text-blue-400 opacity-20"></i>
          </div>
        </div>
        <div class="card p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-400 text-sm mb-2">Videos</p>
              <p class="text-2xl font-bold" id="videoCount">0</p>
            </div>
            <i class="fas fa-video text-3xl text-green-400 opacity-20"></i>
          </div>
        </div>
        <div class="card p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-400 text-sm mb-2">Bookmarks</p>
              <p class="text-2xl font-bold" id="bookmarkCount">0</p>
            </div>
            <i class="fas fa-bookmark text-3xl text-cyan-400 opacity-20"></i>
          </div>
        </div>
        <div class="card p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-400 text-sm mb-2">Quick Notes</p>
              <p class="text-2xl font-bold" id="noteCount">0</p>
            </div>
            <i class="fas fa-sticky-note text-3xl text-purple-400 opacity-20"></i>
          </div>
        </div>
      </div>

      <!-- Search & Filter Section -->
      <div class="card p-6 mb-8">
        <div class="search-container">
          <i class="fas fa-search absolute left-4 top-4 text-purple-400"></i>
          <input
            type="text"
            id="searchInput"
            class="search-bar pl-10"
            placeholder="🔍 सर्च करें - डॉक्स, वीडियो, लिंक्स, नोट्स..."
          />
        </div>
        <div class="flex flex-wrap gap-3">
          <button class="btn btn-primary btn-small" onclick="showAddModal('Business Documents')">
            <i class="fas fa-plus mr-2"></i>Business Doc
          </button>
          <button class="btn btn-primary btn-small" onclick="showAddModal('Video Hub')">
            <i class="fas fa-plus mr-2"></i>Video
          </button>
          <button class="btn btn-primary btn-small" onclick="showAddModal('Bookmarks')">
            <i class="fas fa-plus mr-2"></i>Bookmark
          </button>
          <button class="btn btn-primary btn-small" onclick="showAddModal('Quick Notes')">
            <i class="fas fa-plus mr-2"></i>Note
          </button>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <div class="tabs" style="margin-bottom: 24px;">
        <button class="tab-btn active" onclick="switchTab('all')">
          <i class="fas fa-th mr-2"></i>सभी (All)
        </button>
        <button class="tab-btn" onclick="switchTab('Business Documents')">
          <i class="fas fa-file mr-2"></i>Business
        </button>
        <button class="tab-btn" onclick="switchTab('Video Hub')">
          <i class="fas fa-video mr-2"></i>Videos
        </button>
        <button class="tab-btn" onclick="switchTab('Bookmarks')">
          <i class="fas fa-link mr-2"></i>Bookmarks
        </button>
        <button class="tab-btn" onclick="switchTab('Quick Notes')">
          <i class="fas fa-note mr-2"></i>Notes
        </button>
      </div>

      <!-- Content Area -->
      <div id="contentArea">
        <!-- Will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold gradient-text" id="modalTitle">Add New Entry</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form id="addForm" onsubmit="handleSaveEntry(event)">
        <div id="formFields"></div>
        <div class="flex gap-3 mt-8">
          <button type="submit" class="btn btn-primary flex-1">
            <i class="fas fa-save mr-2"></i><span id="submitBtnText">Save Entry</span>
          </button>
          <button type="button" onclick="closeModal()" class="btn btn-secondary flex-1">
            <i class="fas fa-times mr-2"></i>Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Details Modal -->
  <div class="modal" id="viewModal">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold gradient-text" id="viewTitle">Details</h2>
        <button onclick="closeViewModal()" class="text-gray-400 hover:text-white text-2xl">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="viewContent"></div>
      <div class="flex gap-3 mt-8">
        <button onclick="editCurrentEntry()" class="btn btn-primary flex-1">
          <i class="fas fa-edit mr-2"></i>Edit
        </button>
        <button onclick="deleteCurrentEntry()" class="btn btn-danger flex-1">
          <i class="fas fa-trash mr-2"></i>Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    // Global Variables
    let allData = {};
    let currentTab = 'all';
    let currentEditingEntry = null;
    let currentEditingSheet = null;
    let isDarkMode = true;

    // Initialize App
    function initApp() {
      loadData();
      setupEventListeners();
      loadThemePreference();
    }

    // Setup Event Listeners
    function setupEventListeners() {
      document.getElementById('searchInput').addEventListener('input', handleSearch);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    }

    // Load All Data
    function loadData() {
      showLoading();
      google.script.run.withSuccessHandler(data => {
        allData = data;
        updateDashboardStats();
        renderContent();
        hideLoading();
      }).getDashboardStats();
    }

    // Update Dashboard Stats
    function updateDashboardStats() {
      document.getElementById('docCount').textContent = allData['Business Documents']?.data?.length || 0;
      document.getElementById('videoCount').textContent = allData['Video Hub']?.data?.length || 0;
      document.getElementById('bookmarkCount').textContent = allData['Bookmarks']?.data?.length || 0;
      document.getElementById('noteCount').textContent = allData['Quick Notes']?.data?.length || 0;
    }

    // Switch Tab
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.closest('.tab-btn').classList.add('active');
      renderContent();
    }

    // Render Content
    function renderContent() {
      const container = document.getElementById('contentArea');
      let html = '';

      if (currentTab === 'all') {
        ['Business Documents', 'Video Hub', 'Bookmarks', 'Quick Notes'].forEach(category => {
          html += renderCategory(category);
        });
      } else {
        html = renderCategory(currentTab);
      }

      container.innerHTML = html || '<div class="empty-state"><i class="fas fa-inbox"></i><p>कोई डेटा नहीं मिला</p></div>';
    }

    // Render Category
    function renderCategory(categoryName) {
      const items = allData[categoryName]?.data || [];
      if (items.length === 0) return '';

      let html = `<div class="mb-12">
        <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
          <span class="text-3xl">${getCategoryIcon(categoryName)}</span>
          ${categoryName}
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

      items.forEach(item => {
        html += renderCard(categoryName, item);
      });

      html += '</div></div>';
      return html;
    }

    // Render Card
    function renderCard(category, item) {
      let cardContent = '';

      if (category === 'Business Documents') {
        cardContent = `
          <div class="flex-1">
            <p class="text-sm text-gray-400 mb-2">${item['Document Name']}</p>
            <span class="badge badge-business">${item['Category']}</span>
            <p class="text-xs text-gray-500 mt-2">${item['Date Added']}</p>
          </div>
          <div class="flex gap-2">
            ${item['Upload Link'] ? `<a href="${item['Upload Link']}" target="_blank" class="btn btn-secondary btn-small"><i class="fas fa-external-link-alt"></i></a>` : ''}
            <button onclick="openViewModal('${category}', '${item['ID']}')" class="btn btn-primary btn-small"><i class="fas fa-eye"></i></button>
          </div>
        `;
      } else if (category === 'Video Hub') {
        cardContent = `
          <div class="video-thumbnail" onclick="openViewModal('${category}', '${item['ID']}')">
            <i class="fas fa-play"></i>
          </div>
          <p class="font-semibold mb-2">${item['Title']}</p>
          <span class="badge badge-video">${item['Platform']}</span>
          <div class="flex justify-between items-center mt-4">
            <p class="text-xs text-gray-500">${item['Date Added']}</p>
            <i class="star-icon ${item['Favorite'] === 'Yes' ? 'active' : ''} fas fa-star" onclick="toggleFavorite('${category}', '${item['ID']}', event)"></i>
          </div>
        `;
      } else if (category === 'Bookmarks') {
        cardContent = `
          <p class="font-semibold mb-2">${item['Site Title']}</p>
          <p class="text-sm text-gray-400 mb-3 truncate">${item['URL']}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            ${item['Tags'] ? item['Tags'].split(',').map(tag => `<span class="badge badge-web">${tag.trim()}</span>`).join('') : ''}
          </div>
          <div class="flex gap-2 mt-4">
            <a href="${item['URL']}" target="_blank" class="btn btn-secondary btn-small flex-1"><i class="fas fa-external-link-alt mr-1"></i>Open</a>
            <button class="btn btn-primary btn-small flex-1" onclick="copyToClipboard('${item['URL']}', event)"><i class="fas fa-copy mr-1"></i>Copy</button>
          </div>
        `;
      } else if (category === 'Quick Notes') {
        cardContent = `
          <p class="font-semibold mb-2">${item['Title']}</p>
          <span class="badge ${item['Is Sensitive'] === 'Yes' ? 'badge-urgent' : 'badge-personal'}">${item['Is Sensitive'] === 'Yes' ? '🔒 Sensitive' : '📝 Note'}</span>
          <p class="text-sm text-gray-400 mt-3 line-clamp-3">${item['Is Sensitive'] === 'Yes' ? '••••••••' : item['Content']}</p>
          <button onclick="openViewModal('${category}', '${item['ID']}')" class="btn btn-primary btn-small mt-4 w-full"><i class="fas fa-eye mr-2"></i>View Full</button>
        `;
      }

      return `
        <div class="card p-6 flex flex-col">
          ${cardContent}
        </div>
      `;
    }

    // Get Category Icon
    function getCategoryIcon(category) {
      const icons = {
        'Business Documents': '📄',
        'Video Hub': '🎥',
        'Bookmarks': '🔖',
        'Quick Notes': '📝'
      };
      return icons[category] || '📌';
    }

    // Show Add Modal
    function showAddModal(category) {
      currentEditingEntry = null;
      currentEditingSheet = category;
      document.getElementById('modalTitle').textContent = `Add ${category}`;
      document.getElementById('submitBtnText').textContent = 'Save Entry';

      const fields = getFormFields(category);
      document.getElementById('formFields').innerHTML = fields;
      document.getElementById('addForm').reset();
      document.getElementById('addModal').classList.add('active');
    }

    // Get Form Fields
    function getFormFields(category) {
      let fields = '';

      if (category === 'Business Documents') {
        fields = `
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Document Name *</label>
            <input type="text" name="Document Name" class="input-field w-full" required>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Category</label>
              <select name="Category" class="input-field w-full">
                <option>Invoices</option>
                <option>GST</option>
                <option>Contracts</option>
                <option>ID Cards</option>
                <option>Certificates</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Date</label>
              <input type="date" name="Date Added" class="input-field w-full">
            </div>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Upload Link</label>
            <input type="url" name="Upload Link" class="input-field w-full" placeholder="https://drive.google.com/...">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Notes</label>
            <textarea name="Notes" class="input-field w-full h-24"></textarea>
          </div>
        `;
      } else if (category === 'Video Hub') {
        fields = `
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Title *</label>
            <input type="text" name="Title" class="input-field w-full" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Video URL *</label>
            <input type="url" name="Video URL" class="input-field w-full" required placeholder="https://youtube.com/... or https://drive.google.com/...">
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Platform</label>
              <select name="Platform" class="input-field w-full">
                <option>YouTube</option>
                <option>Google Drive</option>
                <option>Vimeo</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Category</label>
              <input type="text" name="Category" class="input-field w-full" placeholder="Tutorial, Demo, etc.">
            </div>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Mark as Favorite?</label>
            <select name="Favorite" class="input-field w-full">
              <option>No</option>
              <option>Yes</option>
            </select>
          </div>
          <input type="hidden" name="Date Added" value="${new Date().toLocaleDateString()}">
        `;
      } else if (category === 'Bookmarks') {
        fields = `
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Site Title *</label>
            <input type="text" name="Site Title" class="input-field w-full" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">URL *</label>
            <input type="url" name="URL" class="input-field w-full" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Tags (comma separated)</label>
            <input type="text" name="Tags" class="input-field w-full" placeholder="Business, Important, Admin">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Description</label>
            <textarea name="Description" class="input-field w-full h-20"></textarea>
          </div>
          <input type="hidden" name="Date Added" value="${new Date().toLocaleDateString()}">
        `;
      } else if (category === 'Quick Notes') {
        fields = `
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Title *</label>
            <input type="text" name="Title" class="input-field w-full" required>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold mb-2">Content *</label>
            <textarea name="Content" class="input-field w-full h-28" required placeholder="Enter your notes here..."></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-semibold mb-2">Category</label>
              <input type="text" name="Category" class="input-field w-full" placeholder="Personal, Work, etc.">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2">Sensitive Data?</label>
              <select name="Is Sensitive" class="input-field w-full">
                <option>No</option>
                <option>Yes</option>
              </select>
            </div>
          </div>
          <input type="hidden" name="Date Added" value="${new Date().toLocaleDateString()}">
        `;
      }

      return fields;
    }

    // Close Modal
    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
      currentEditingEntry = null;
    }

    // Handle Save Entry
    function handleSaveEntry(e) {
      e.preventDefault();
      const formData = new FormData(document.getElementById('addForm'));
      const data = Object.fromEntries(formData);

      if (currentEditingEntry) {
        google.script.run.withSuccessHandler(result => {
          if (result.success) {
            showToast('Entry updated successfully! ✅');
            closeModal();
            loadData();
          }
        }).updateEntry(currentEditingSheet, currentEditingEntry, data);
      } else {
        google.script.run.withSuccessHandler(result => {
          if (result.success) {
            showToast('Entry added successfully! ✅');
            closeModal();
            loadData();
          }
        }).addEntry(currentEditingSheet, data);
      }
    }

    // Open View Modal
    function openViewModal(category, id) {
      currentEditingSheet = category;
      currentEditingEntry = id;
      const item = allData[category].data.find(d => d.ID === id);

      if (!item) return;

      document.getElementById('viewTitle').textContent = item['Title'] || item['Document Name'] || item['Site Title'];

      let content = '';
      if (category === 'Business Documents') {
        content = `
          <div class="space-y-4">
            <div>
              <p class="text-sm text-gray-400">Document Name</p>
              <p class="text-lg font-semibold">${item['Document Name']}</p>
            </div>
            <div>
              <p class="text-sm text-gray-400">Category</p>
              <span class="badge badge-business">${item['Category']}</span>
            </div>
            <div>
              <p class="text-sm text-gray-400">Date</p>
              <p>${item['Date Added']}</p>
            </div>
            ${item['Upload Link'] ? `<div><p class="text-sm text-gray-400">Document Link</p><a href="${item['Upload Link']}" target="_blank" class="btn btn-secondary btn-small"><i class="fas fa-external-link-alt mr-2"></i>Open Document</a></div>` : ''}
            ${item['Notes'] ? `<div><p class="text-sm text-gray-400">Notes</p><p>${item['Notes']}</p></div>` : ''}
          </div>
        `;
      } else if (category === 'Video Hub') {
        content = `
          <div class="space-y-4">
            <div class="video-thumbnail" onclick="window.open('${item['Video URL']}')" style="cursor: pointer;">
              <i class="fas fa-play"></i>
            </div>
            <div>
              <p class="text-sm text-gray-400">Platform</p>
              <p>${item['Platform']}</p>
            </div>
            <div>
              <p class="text-sm text-gray-400">Category</p>
              <span class="badge badge-video">${item['Category']}</span>
            </div>
            <div>
              <a href="${item['Video URL']}" target="_blank" class="btn btn-secondary w-full"><i class="fas fa-external-link-alt mr-2"></i>Watch Video</a>
            </div>
          </div>
        `;
      } else if (category === 'Bookmarks') {
        content = `
          <div class="space-y-4">
            <div>
              <p class="text-sm text-gray-400">Website</p>
              <p class="text-lg font-semibold">${item['Site Title']}</p>
            </div>
            <div>
              <p class="text-sm text-gray-400">URL</p>
              <p class="break-all text-cyan-400">${item['URL']}</p>
              <button class="btn btn-primary btn-small mt-2" onclick="copyToClipboard('${item['URL']}'"><i class="fas fa-copy mr-2"></i>Copy URL</button>
            </div>
            ${item['Tags'] ? `<div><p class="text-sm text-gray-400">Tags</p><div class="flex flex-wrap gap-2">${item['Tags'].split(',').map(tag => `<span class="badge badge-web">${tag.trim()}</span>`).join('')}</div></div>` : ''}
            ${item['Description'] ? `<div><p class="text-sm text-gray-400">Description</p><p>${item['Description']}</p></div>` : ''}
            <div>
              <a href="${item['URL']}" target="_blank" class="btn btn-secondary w-full"><i class="fas fa-external-link-alt mr-2"></i>Open Website</a>
            </div>
          </div>
        `;
      } else if (category === 'Quick Notes') {
        content = `
          <div class="space-y-4">
            <div>
              <p class="text-sm text-gray-400">Title</p>
              <p class="text-lg font-semibold">${item['Title']}</p>
            </div>
            ${item['Category'] ? `<div><span class="badge badge-personal">${item['Category']}</span></div>` : ''}
            <div>
              <p class="text-sm text-gray-400">Content</p>
              <div class="bg-black bg-opacity-30 p-4 rounded-lg border border-gray-700 mt-2">
                <p class="whitespace-pre-wrap font-mono text-sm">${item['Content']}</p>
              </div>
              <button class="btn btn-primary btn-small mt-3 w-full" onclick="copyToClipboard(\`${item['Content'].replace(/`/g, '\\`')}\`)"><i class="fas fa-copy mr-2"></i>Copy Content</button>
            </div>
            ${item['Is Sensitive'] === 'Yes' ? `<div class="bg-red-900 bg-opacity-20 border border-red-700 rounded-lg p-3"><i class="fas fa-lock text-red-400 mr-2"></i>🔒 This is sensitive data</div>` : ''}
          </div>
        `;
      }

      document.getElementById('viewContent').innerHTML = content;
      document.getElementById('viewModal').classList.add('active');
    }

    // Close View Modal
    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('active');
      currentEditingEntry = null;
    }

    // Edit Current Entry
    function editCurrentEntry() {
      closeViewModal();
      const item = allData[currentEditingSheet].data.find(d => d.ID === currentEditingEntry);
      currentEditingEntry = item.ID;
      
      document.getElementById('modalTitle').textContent = `Edit ${currentEditingSheet}`;
      document.getElementById('submitBtnText').textContent = 'Update Entry';

      const fields = getFormFields(currentEditingSheet);
      document.getElementById('formFields').innerHTML = fields;

      // Populate form fields
      Object.keys(item).forEach(key => {
        const field = document.querySelector(`[name="${key}"]`);
        if (field) {
          field.value = item[key];
        }
      });

      document.getElementById('addModal').classList.add('active');
    }

    // Delete Current Entry
    function deleteCurrentEntry() {
      if (confirm('Are you sure you want to delete this entry? यह क्रिया वापस नहीं की जा सकती।')) {
        google.script.run.withSuccessHandler(result => {
          if (result.success) {
            showToast('Entry deleted successfully! 🗑️');
            closeViewModal();
            loadData();
          }
        }).deleteEntry(currentEditingSheet, currentEditingEntry);
      }
    }

    // Handle Search
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      
      if (!query) {
        renderContent();
        return;
      }

      google.script.run.withSuccessHandler(results => {
        const container = document.getElementById('contentArea');
        let html = '';

        Object.keys(results).forEach(category => {
          if (results[category].length > 0) {
            html += `<div class="mb-12">
              <h2 class="text-2xl font-bold mb-6">${getCategoryIcon(category)} ${category}</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            
            results[category].forEach(item => {
              html += renderCard(category, item);
            });

            html += '</div></div>';
          }
        });

        container.innerHTML = html || '<div class="empty-state"><i class="fas fa-search"></i><p>कोई परिणाम नहीं मिले</p></div>';
      }).searchData(query);
    }

    // Copy to Clipboard
    function copyToClipboard(text, e) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Copied to clipboard! 📋');
        if (e) e.target.style.backgroundColor = '#10b981';
      });
    }

    // Toggle Favorite
    function toggleFavorite(category, id, e) {
      e.stopPropagation();
      const item = allData[category].data.find(d => d.ID === id);
      const newFav = item['Favorite'] === 'Yes' ? 'No' : 'Yes';

      google.script.run.withSuccessHandler(result => {
        if (result.success) {
          item['Favorite'] = newFav;
          e.target.classList.toggle('active');
          showToast(newFav === 'Yes' ? '⭐ Added to favorites!' : '✨ Removed from favorites!');
        }
      }).updateEntry(category, id, { 'Favorite': newFav });
    }

    // Toggle Theme
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
      updateThemeIcon();
    }

    // Load Theme Preference
    function loadThemePreference() {
      const theme = localStorage.getItem('theme') || 'dark';
      isDarkMode = theme === 'dark';
      if (theme === 'light') {
        document.body.classList.add('light-mode');
      }
      updateThemeIcon();
    }

    // Update Theme Icon
    function updateThemeIcon() {
      const icon = document.getElementById('themeToggle').querySelector('i');
      if (isDarkMode) {
        icon.className = 'fas fa-sun';
      } else {
        icon.className = 'fas fa-moon';
      }
    }

    // Show Toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerHTML = message;
      toast.classList.add('toast');
      setTimeout(() => {
        toast.classList.remove('toast');
      }, 3000);
    }

    // Show Loading
    function showLoading() {
      document.getElementById('contentArea').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${[1,2,3,4,5,6].map(() => '<div class="card p-6 h-64 skeleton"></div>').join('')}
        </div>
      `;
    }

    // Hide Loading
    function hideLoading() {}

    // Initialize on Load
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
